
name: Global Task Gap Engine

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-task-gap-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-task-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TELEGRAMBOTTOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
      TARGETCHATID: ${{ secrets.TARGETCHATID }}
      MINIMUM_REWARD_USD: "0.75"
      FX_TO_USD_JSON: '{"USD":"1"}'
      TASK_DB_PATH: task_engine.sqlite3
      LOG_LEVEL: INFO

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Validate Configuration
        run: |
          python - <<'PY'
          import os
          import sys

          required = ("TELEGRAMBOTTOKEN", "TARGETCHATID")
          missing = [
              key for key in required
              if not os.environ.get(key, "").strip()
          ]

          if missing:
              print("Missing required GitHub Secrets: " + ", ".join(missing))
              sys.exit(1)

          print("Required Telegram configuration is present.")
          PY

      - name: Run Global Task Scan
        run: python task_bot.py
