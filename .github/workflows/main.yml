name: Production Arbitrage Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggers from GitHub Mobile/Web
  repository_dispatch:  # Allows instant triggering via external webhooks
    types: [trigger-arbitrage]

jobs:
  run-arbitrage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install httpx

      - name: Run Arbitrage Core Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: python bot.py
