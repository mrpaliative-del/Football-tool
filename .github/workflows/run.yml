name: 247 Arbitrage Robot Engine

on:
  push:
    branches: [ main ]
  schedule:
    # ─── HIGH-FREQUENCY NATIVE CRON SCRIPT ───
    # This explicit cron instruction forces GitHub's clock to automatically launch 
    # your system container every 15 minutes, completely independent of human touch.
    - cron: '*/15 * * * *'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Arbitrage Machine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: python bot.py
