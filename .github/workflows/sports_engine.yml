
name: Sports Value Engine

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sports-engine:
    name: Run Multi-Match Arbitrage Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      TELEGRAMBOTTOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
      TARGETCHATID: ${{ secrets.TARGETCHATID }}

      BANKROLLPOOL: "20000"
      MIN_ARBITRAGE_ROI: "0.5"
      MAX_ARBITRAGE_ROI: "30"

      RUN_DURATION_SECONDS: "480"
      POLL_INTERVAL_SECONDS: "15"
      PAGE_WAIT_SECONDS: "5"

      ARBITRAGE_DB_PATH: arbitrage_state.sqlite3
      LOG_LEVEL: INFO

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate Required Files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt is missing from the repository root."
            exit 1
          fi

          if [ -f multi_match_arbitrage.py ]; then
            echo "SCANNER_FILE=multi_match_arbitrage.py" >> "$GITHUB_ENV"
          elif [ -f bot.py ]; then
            echo "SCANNER_FILE=bot.py" >> "$GITHUB_ENV"
          else
            echo "::error::Neither multi_match_arbitrage.py nor bot.py was found in the repository root."
            exit 1
          fi

          echo "Required files validated."

      - name: Install Ubuntu Audio Library
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Playwright Installation
        run: |
          python -c "import playwright; print('Playwright Python package installed successfully.')"

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Validate Telegram Configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAMBOTTOKEN" ]; then
            echo "::error::Missing TELEGRAMBOTTOKEN repository secret."
            exit 1
          fi

          if [ -z "$TARGETCHATID" ]; then
            echo "::error::Missing TARGETCHATID repository secret."
            exit 1
          fi

          echo "Telegram configuration is present."

      - name: Run Multi-Match Arbitrage Scanner
        run: |
          echo "Starting scanner: $SCANNER_FILE"
          python -u "$SCANNER_FILE"
