
name: Sports Value Engine

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sports-engine:
    name: Run Multi-Match Arbitrage Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAMBOTTOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
      TARGETCHATID: ${{ secrets.TARGETCHATID }}
      BANKROLLPOOL: "20000"
      MIN_ARBITRAGE_ROI: "5"
      MAX_ARBITRAGE_ROI: "50"
      RUN_DURATION_SECONDS: "480"
      POLL_INTERVAL_SECONDS: "15"
      PAGE_WAIT_SECONDS: "5"
      LOG_LEVEL: INFO
      BOOKMAKER_A_URL: "https://www.sportybet.com/ng/sport/football"
      BOOKMAKER_B_URL: "https://www.bet9ja.com/sport/soccer"
      ARBITRAGE_DB_PATH: arbitrage_signals.sqlite3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate Repository Files
        run: |
          test -f requirements.txt || {
            echo "::error::requirements.txt is missing"
            exit 1
          }

          if [ ! -f multi_match_arbitrage.py ] && [ ! -f bot.py ]; then
            echo "::error::Scanner file missing: expected multi_match_arbitrage.py or bot.py"
            exit 1
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate Telegram Secrets
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["TELEGRAMBOTTOKEN", "TARGETCHATID"]
          missing = [
              key for key in required
              if not os.environ.get(key, "").strip()
          ]

          if missing:
              print("Missing GitHub Secrets: " + ", ".join(missing))
              sys.exit(1)

          print("Telegram configuration is present.")
          PY

      - name: Run Multi-Match Arbitrage Scanner
        run: |
          if [ -f multi_match_arbitrage.py ]; then
            python -u multi_match_arbitrage.py
          else
            python -u bot.py
          fi
