name: Sports Value Engine

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sports-engine:
    name: Run Multi-Match Arbitrage Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAMBOTTOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
      TARGETCHATID: ${{ secrets.TARGETCHATID }}
      BANKROLLPOOL: "20000"
      MIN_ARBITRAGE_ROI: "0.5"
      MAX_ARBITRAGE_ROI: "30"
      TIMELINE_HOURS: "48"
      ARBITRAGE_DB_PATH: arbitrage_state.sqlite3
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate files and secrets
        shell: bash
        run: |
          set -euo pipefail

          test -f bot.py || {
            echo "::error::bot.py is missing"
            exit 1
          }

          test -f requirements.txt || {
            echo "::error::requirements.txt is missing"
            exit 1
          }

          test -n "$ODDS_API_KEY" || {
            echo "::error::Missing ODDS_API_KEY secret"
            exit 1
          }

          test -n "$TELEGRAMBOTTOKEN" || {
            echo "::error::Missing TELEGRAMBOTTOKEN secret"
            exit 1
          }

          test -n "$TARGETCHATID" || {
            echo "::error::Missing TARGETCHATID secret"
            exit 1
          }

          python -m py_compile bot.py
          echo "File and required-secret checks passed."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run scanner
        run: python -u bot.py
