name: Global Task Gap Engine

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/15 * * * *'   # Runs every 15 minutes, 24/7
  workflow_dispatch:

jobs:
  run-task-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Execute Global Task Engine
        env:
          TELEGRAMBOTTOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
          TARGETCHATID: ${{ secrets.TARGETCHATID }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SE... }} # Use your exact secret name
        run: python task_bot.py
