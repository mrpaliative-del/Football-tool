
name: Global Task Gap Engine

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-task-engine:
    name: Run Global Task Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAMBOTTOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
      TARGETCHATID: ${{ secrets.TARGETCHATID }}
      MINIMUM_REWARD_USD: "0.75"
      FX_TO_USD_JSON: '{"USD":"1"}'
      TASK_DB_PATH: task_engine.sqlite3
      LOG_LEVEL: INFO

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate Repository Files
        run: |
          test -f task_bot.py || {
            echo "::error::task_bot.py is missing from the repository root"
            exit 1
          }

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Validate Telegram Secrets
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["TELEGRAMBOTTOKEN", "TARGETCHATID"]
          missing = [
              key for key in required
              if not os.environ.get(key, "").strip()
          ]

          if missing:
              print("Missing GitHub Secrets: " + ", ".join(missing))
              sys.exit(1)

          print("Telegram configuration is present.")
          PY

      - name: Run Global Task Scan
        run: python -u task_bot.py
