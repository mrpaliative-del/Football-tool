name: Global Task Gap Engine

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours continuously
  workflow_dispatch:

jobs:
  run-task-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright httpx
          playwright install chromium --with-deps

      - name: Execute Global Task Engine
        env:
          TELEGRAMBOTTOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
          TARGETCHATID: ${{ secrets.TARGETCHATID }}
          ACTION_KEY: ${{ secrets.ACTION_KEY }}
        run: python task_bot.py
